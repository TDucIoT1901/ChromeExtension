name: Code checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n cloud/start.sh cloud/setup.sh
      - name: Extension regression tests
        run: node --test tests/*.cjs
      - name: Cloud and Linux process checks
        run: python3 -m unittest discover -s cloud -p 'test*.py'
